name: Ensure RST is well-formed

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  rstcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run rstcheck
        run: make rstcheck
